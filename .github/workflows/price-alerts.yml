name: Price Alerts Cron

on:
  schedule:
    # Runs every 5 minutes (GitHub Actions minimum is ~5 mins for free)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  trigger-price-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Call Price Alerts API
        run: |
          curl -X GET "https://rayo.trade/api/cron/price-alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail --silent --show-error
        continue-on-error: true
