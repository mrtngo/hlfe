<!DOCTYPE html>
<html>
<head>
    <title>Rayo Icon Generator</title>
    <style>
        body { font-family: system-ui; padding: 40px; background: #1a1a1a; color: white; }
        .icon { margin: 10px; display: inline-block; }
        canvas { border: 1px solid #333; border-radius: 20%; }
        button { background: #FACC15; color: black; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 20px 0; }
        h1 { color: #FACC15; }
        .instructions { background: #2a2a2a; padding: 20px; border-radius: 12px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Rayo PWA Icon Generator</h1>

    <div class="instructions">
        <h3>Instructions:</h3>
        <ol>
            <li>Click "Generate All Icons" below</li>
            <li>Right-click each icon and "Save Image As..."</li>
            <li>Save them to your <code>public/icons/</code> folder with the name shown</li>
        </ol>
    </div>

    <button onclick="generateAll()">Generate All Icons</button>

    <div id="icons"></div>

    <script>
        const sizes = [32, 72, 96, 128, 144, 152, 180, 192, 384, 512];

        function drawIcon(size, isMaskable = false) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = '#000000';
            if (isMaskable) {
                // Maskable icons need full bleed
                ctx.fillRect(0, 0, size, size);
            } else {
                // Regular icons with rounded corners
                ctx.beginPath();
                ctx.roundRect(0, 0, size, size, size * 0.2);
                ctx.fill();
            }

            // Lightning bolt
            const scale = size / 100;
            const offsetX = size * 0.1;
            const offsetY = size * 0.05;

            ctx.strokeStyle = '#FACC15';
            ctx.lineWidth = Math.max(2, size * 0.04);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Glow effect
            ctx.shadowColor = '#FACC15';
            ctx.shadowBlur = size * 0.08;

            ctx.beginPath();
            ctx.moveTo(55 * scale + offsetX, 10 * scale + offsetY);
            ctx.lineTo(25 * scale + offsetX, 52 * scale + offsetY);
            ctx.lineTo(45 * scale + offsetX, 52 * scale + offsetY);
            ctx.lineTo(38 * scale + offsetX, 90 * scale + offsetY);
            ctx.lineTo(75 * scale + offsetX, 42 * scale + offsetY);
            ctx.lineTo(52 * scale + offsetX, 42 * scale + offsetY);
            ctx.lineTo(55 * scale + offsetX, 10 * scale + offsetY);
            ctx.stroke();

            return canvas;
        }

        function generateAll() {
            const container = document.getElementById('icons');
            container.innerHTML = '<h2>Regular Icons:</h2>';

            sizes.forEach(size => {
                const div = document.createElement('div');
                div.className = 'icon';
                const canvas = drawIcon(size, false);
                const name = size === 180 ? 'apple-touch-icon.png' : `icon-${size}x${size}.png`;
                div.innerHTML = `<div>${name}</div>`;
                div.appendChild(canvas);
                container.appendChild(div);
            });

            container.innerHTML += '<h2 style="margin-top: 40px;">Maskable Icons:</h2>';

            [192, 512].forEach(size => {
                const div = document.createElement('div');
                div.className = 'icon';
                const canvas = drawIcon(size, true);
                div.innerHTML = `<div>icon-maskable-${size}x${size}.png</div>`;
                div.appendChild(canvas);
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
